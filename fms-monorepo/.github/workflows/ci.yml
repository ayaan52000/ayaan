name: FMS CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma format --check
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/fms
      - run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/fms
      - run: node --check src/server.js
      - run: node --check prisma/seed.js
      - run: node --check prisma/seed.production.js
      - run: node --check scripts/migrate-local-receipts.js
      - run: node --check src/lib/receiptSafety.js
      - run: node --check src/lib/storage.js
      - run: npm run test:storage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://user:password@localhost:5432/fms
          JWT_SECRET: ci-storage-test-secret-with-at-least-32-characters
          FRONTEND_URL: http://localhost:3000
          COOKIE_SECURE: "false"
          STORAGE_PROVIDER: local

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
