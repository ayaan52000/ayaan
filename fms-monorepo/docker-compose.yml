services:
  postgres:
    image: postgres:16-alpine
    container_name: fms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fms_db
    ports:
      - "5433:5432"
    volumes:
      - fms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fms_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fms_postgres_data:
