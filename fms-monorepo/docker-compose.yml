services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: fms_db
    ports:
      - "5433:5432"
    volumes:
      - fms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fms_db"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    command: ["sh", "-c", "npx prisma migrate deploy && npm run seed:dev && node src/server.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/fms_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-development-only-jwt-secret-please-change-1234567890}
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      COOKIE_SECURE: "false"
      BUDGET_ENFORCEMENT: ${BUDGET_ENFORCEMENT:-warn}
      EMAIL_NOTIFICATIONS_ENABLED: "false"
      DEV_SEED_FINANCE_PASSWORD: ${DEV_SEED_FINANCE_PASSWORD:-FinanceDevOnly!123}
      DEV_SEED_USER_PASSWORD: ${DEV_SEED_USER_PASSWORD:-UserDevOnly!12345}
    ports:
      - "4000:4000"
    volumes:
      - fms_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  fms_postgres_data:
  fms_uploads:
